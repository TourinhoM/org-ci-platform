# Single responsibility: testes Python de projeto gerenciado pelo uv.
# Diferente do unit-test-python (pip + requirements/extras), aqui o lockfile
# manda: `uv sync --frozen` instala exatamente o uv.lock, e os comandos rodam
# dentro do ambiente do projeto.
name: Unit Test uv
description: uv sync --frozen e roda os comandos de teste/lint do projeto

inputs:
  python-version:
    required: false
    default: '3.13'
  working-directory:
    description: 'Diretorio do pyproject.toml, relativo a raiz do repo'
    required: false
    default: '.'
  commands:
    description: 'Comandos a rodar apos o sync, um por linha'
    required: false
    default: 'uv run pytest'

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen

    - name: Run commands
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMANDS: ${{ inputs.commands }}
      run: |
        set -euo pipefail
        while IFS= read -r cmd; do
          [ -z "${cmd// }" ] && continue
          echo "::group::$cmd"
          bash -euo pipefail -c "$cmd"
          echo "::endgroup::"
        done <<< "$COMMANDS"
