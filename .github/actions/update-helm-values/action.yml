# Config-sync (Helm, values-layering): COPIA o contrato do dev de
# tools/microsservico/ (repo de código) pro repo de gitops. Cópia pura — o dev já
# escreve na forma do gitops (aninhado sob a chave do arquétipo), então não há
# re-key. Materializa:
#   tools/microsservico/values.yaml        -> gitops/values.yaml        (base)
#   tools/microsservico/values/<env>.yaml  -> gitops/values/<env>.yaml  (delta do dev)
# NÃO toca em values/<env>.image.yaml (dono = Kargo) nem no Chart.yaml (Renovate).
name: Config Sync (Helm values-layering)
description: >
  Copia os values do dev (tools/microsservico) pro gitops (base + delta por env),
  preservando os arquivos de máquina (image do Kargo, Chart do Renovate).

inputs:
  tools-dir:
    description: Diretório tools/microsservico no checkout do código (base + values/<env>.yaml)
    required: true
  gitops-dir:
    description: Diretório do checkout do gitops (com Chart.yaml e values/)
    required: false
    default: gitops

runs:
  using: composite
  steps:
    - name: Copia values do dev (base + deltas por env) pro gitops
      shell: bash
      run: |
        set -euo pipefail
        td='${{ inputs.tools-dir }}'
        gd='${{ inputs.gitops-dir }}'

        # Base — o dev já escreve aninhado sob a chave do arquétipo: cópia direta.
        cp "$td/values.yaml" "$gd/values.yaml"

        # Deltas por ambiente — só os arquivos do dev (dev/hml/prod.yaml). O glob
        # NÃO pega *.image.yaml (Kargo) porque esses não existem em tools/.
        mkdir -p "$gd/values"
        if compgen -G "$td/values/*.yaml" > /dev/null; then
          cp "$td"/values/*.yaml "$gd/values/"
        fi

        echo "gitops/values.yaml e values/<env>.yaml sincronizados a partir de tools/microsservico."

    - name: Commit and push
      shell: bash
      working-directory: ${{ inputs.gitops-dir }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Só os arquivos do dev — image.yaml e Chart.yaml ficam de fora do add.
        git add values.yaml values/*.yaml
        # Remove do stage qualquer *.image.yaml que o glob acima tenha pego.
        git reset -q -- 'values/*.image.yaml' 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "Nenhuma alteração — gitops já em sincronia com o contrato."
          exit 0
        fi
        git commit -m "chore(config): sync values do tools/microsservico [skip ci]"
        git push origin HEAD:main
