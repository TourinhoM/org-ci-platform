name: CI - Push

on:
  workflow_call:
    inputs:
      dockerfile-path:
        required: false
        default: './Dockerfile'
        type: string
      coverage-exclusions:
        required: false
        type: string
      security-bypass:
        required: false
        default: false
        type: boolean
        description: 'Roda os scans de segurança em modo não-bloqueante (findings reportados mas não travam a pipe)'
    secrets:
      SONAR_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -----------------------------
  # 1️⃣ Trivy FS
  # -----------------------------
  trivy-fs:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: ⚠️ Security scans running in non-blocking mode
        if: ${{ inputs.security-bypass }}
        run: echo "::warning::security-bypass=true — scans will run but findings will NOT block the pipeline."
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-fs@main
        continue-on-error: ${{ inputs.security-bypass }}

  # -----------------------------
  # 2️⃣ Secret Scan (gitleaks)
  # -----------------------------
  #secret-scan:
  #  name: Secret Scan
  #  runs-on: ubuntu-latest
  #  permissions:
  #    contents: read
  #  steps:
  #    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
  #      with:
  #        fetch-depth: 0
  #    - uses: TourinhoM/org-ci-platform/.github/actions/secret-scan@main

  # -----------------------------
  # 3️⃣ Trivy Config (Dockerfile lint)
  # -----------------------------
  trivy-config:
    name: Trivy Config Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ⚠️ Security scans running in non-blocking mode
        if: ${{ inputs.security-bypass }}
        run: echo "::warning::security-bypass=true — scans will run but findings will NOT block the pipeline."
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-config@main
        continue-on-error: ${{ inputs.security-bypass }}
        with:
          config-path: ${{ inputs.dockerfile-path }}

  # -----------------------------
  # 4️⃣ SAST (SonarQube quando SONAR_ORG está configurado; senão Semgrep)
  # -----------------------------
  # Job único com steps condicionais em vez de dois jobs mutuamente
  # exclusivos: skip de JOB contamina a cadeia transitiva de needs e pula
  # docker-build/trivy-image/docker-push mesmo com prepare-image verde.
  # Skip de STEP não contamina nada — o grafo fica 100% incondicional.
  sast:
    name: SAST
    runs-on: ubuntu-latest
    needs: [trivy-fs, trivy-config]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: ⚠️ Security scans running in non-blocking mode
        if: ${{ inputs.security-bypass }}
        run: echo "::warning::security-bypass=true — scans will run but findings will NOT block the pipeline."
      - uses: TourinhoM/org-ci-platform/.github/actions/unit-test@main
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: ${{ inputs.security-bypass }}
      - name: SonarQube
        if: ${{ vars.SONAR_ORG != '' && !startsWith(github.ref, 'refs/tags/') }}
        uses: TourinhoM/org-ci-platform/.github/actions/sonarqube@main
        continue-on-error: ${{ inputs.security-bypass }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          sonar-organization: ${{ vars.SONAR_ORG }}
          coverage-exclusions: ${{ inputs.coverage-exclusions }}
          sonar-args: ""
      - name: Semgrep
        if: ${{ vars.SONAR_ORG == '' && !startsWith(github.ref, 'refs/tags/') }}
        uses: TourinhoM/org-ci-platform/.github/actions/semgrep@main
        continue-on-error: ${{ inputs.security-bypass }}

  # -----------------------------
  # 5️⃣ Prepare Image
  # -----------------------------
  prepare-image:
    name: Prepare image
    runs-on: ubuntu-latest
    needs: sast
    outputs:
      image_repo: ${{ steps.prepare.outputs.repo }}
      image_tag: ${{ steps.prepare.outputs.tag }}
      push_tags: ${{ steps.prepare.outputs.push_tags }}
    steps:
      - id: prepare
        uses: TourinhoM/org-ci-platform/.github/actions/prepare-image-tag@main

  # -----------------------------
  # 6️⃣ Docker Build + Trivy Image
  # Trivy roda no mesmo job: imagem já está no daemon via load: true,
  # sem necessidade de artifact upload/download.
  # -----------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: prepare-image
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: TourinhoM/org-ci-platform/.github/actions/docker-build-artifact@main
        with:
          image-ref: ghcr.io/${{ needs.prepare-image.outputs.image_repo }}:${{ needs.prepare-image.outputs.image_tag }}
          dockerfile-path: ./Dockerfile
          upload-artifact: 'false'
      - name: ⚠️ Security scans running in non-blocking mode
        if: ${{ inputs.security-bypass }}
        run: echo "::warning::security-bypass=true — scans will run but findings will NOT block the pipeline."
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-image@main
        continue-on-error: ${{ inputs.security-bypass }}
        with:
          image-ref: ghcr.io/${{ needs.prepare-image.outputs.image_repo }}:${{ needs.prepare-image.outputs.image_tag }}

  # -----------------------------
  # 8️⃣ Docker Push
  # -----------------------------
