name: CI - Pull Request

on:
  workflow_call:
    inputs:
      coverage-exclusions:
        required: false
        type: string
      gitleaks-config:
        description: Caminho do config do gitleaks
        required: false
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Variante privada do ci-pr.yml, sem o job de SAST: nos repos privados a
# análise de código fica a cargo da integração nativa SonarCloud ↔ GitHub,
# que já cobre pull request e branch principal.
#
# `coverage-exclusions` e o secret SONAR_TOKEN seguem declarados de propósito,
# mesmo sem uso aqui: workflow_call rejeita input ou secret que o caller passa
# e o workflow não declara ("Invalid workflow: unexpected secret"). Mantê-los
# permite trocar ci-pr.yml por este arquivo sem tocar no caller.

jobs:

  # -----------------------------
  # 1️⃣ Trivy FS
  # -----------------------------
  trivy-fs:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-fs@main

  # -----------------------------
  # 2️⃣ Secret Scan (gitleaks)
  # -----------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: TourinhoM/org-ci-platform/.github/actions/secret-scan@main
        with:
          gitleaks-config: ${{ inputs.gitleaks-config }}

  # -----------------------------
  # 3️⃣ Semantic Commit Check
  # -----------------------------
  # No ci-pr.yml este job depende de sast. Como sast não existe aqui, foi
  # repontado para trivy-fs — mantém a ordem original (scan de segurança antes
  # do check) e evita needs apontando para job inexistente, que invalida o
  # workflow inteiro.
  semantic-commit-check:
    name: Semantic Commit Check
    runs-on: ubuntu-latest
    needs: trivy-fs
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: TourinhoM/org-ci-platform/.github/actions/semantic-commit-check@main
