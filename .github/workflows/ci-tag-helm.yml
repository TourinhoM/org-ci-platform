name: CI - Tag Release (Helm)

# Variante Helm do ci-tag.yml: idêntica, EXCETO a promoção (job update-gitops),
# que atualiza a image: no values.yaml do consumer chart (gitops Helm) em vez do
# kustomization.yaml. Criada como reusable separado de propósito — o ci-tag.yml
# (kustomize) fica intocado, e cada cenário (kustomize × Helm) evolui/testa
# isolado. Custo: build/trivy/push/supply-chain duplicados; ao mudar esses,
# mudar nos dois. Usada pelo caller do template new-service-helm.

on:
  workflow_call:
    inputs:
      dockerfile-path:
        required: false
        default: './Dockerfile'
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: false
        description: >
          Private key (.pem) do GitHub App RELEASE_APP, usada na promoção
          cross-repo da tag no gitops-<app> (job update-gitops). Secret
          acessado sob `secrets: inherit` precisa ser DECLARADO aqui pra
          popular — senão chega vazio (footgun do reusable workflow).

# Tag pipeline produz artefato versionado — nao cancelar em meio ao push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # -----------------------------
  # 1️⃣ Trivy FS
  # -----------------------------
  trivy-fs:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-fs@main

  # -----------------------------
  # 2️⃣ Trivy Config (Dockerfile lint)
  # -----------------------------
  trivy-config:
    name: Trivy Config Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-config@main
        with:
          config-path: ${{ inputs.dockerfile-path }}

  # -----------------------------
  # 3️⃣ Prepare Image
  # -----------------------------
  prepare-image:
    name: Prepare image
    runs-on: ubuntu-latest
    needs: [trivy-fs, trivy-config]
    outputs:
      image_repo: ${{ steps.prepare.outputs.repo }}
      image_tag: ${{ steps.prepare.outputs.tag }}
      push_tags: ${{ steps.prepare.outputs.push_tags }}
    steps:
      - id: prepare
        uses: TourinhoM/org-ci-platform/.github/actions/prepare-image-tag@main

  # -----------------------------
  # 4️⃣ Docker Build + Trivy Image
  # Trivy roda no mesmo job: imagem já está no daemon via load: true,
  # sem necessidade de artifact download em job separado.
  # -----------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: prepare-image
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: TourinhoM/org-ci-platform/.github/actions/docker-build-artifact@main
        with:
          image-ref: ghcr.io/${{ needs.prepare-image.outputs.image_repo }}:${{ needs.prepare-image.outputs.image_tag }}
          dockerfile-path: ./Dockerfile
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-image@main
        with:
          image-ref: ghcr.io/${{ needs.prepare-image.outputs.image_repo }}:${{ needs.prepare-image.outputs.image_tag }}

  # -----------------------------
  # 5️⃣ Docker Push
  # -----------------------------
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [docker-build, prepare-image]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      LOGIN_USERNAME: ${{ github.actor }}
      LOGIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - id: push
        uses: TourinhoM/org-ci-platform/.github/actions/docker-push-artifact@main
        with:
          image-ref: ghcr.io/${{ needs.prepare-image.outputs.image_repo }}:${{ needs.prepare-image.outputs.image_tag }}
          push-tags: ${{ needs.prepare-image.outputs.push_tags }}
          registry: ghcr.io

  # -----------------------------
  # 7️⃣ Promoção da image → agora é do KARGO (não mais o CI)
  # -----------------------------
  # O antigo job update-gitops (update-helm-image no values.yaml) foi REMOVIDO: no
  # modelo values-layering + Kargo, a image é escrita pelo Warehouse/Stage (pin por
  # digest em values/<env>.image.yaml; dev auto → hml → prod gated). O CI só builda,
  # escaneia e publica no ghcr; o Kargo observa e promove — assim CI e Kargo não
  # brigam pela image. (RELEASE_APP_PRIVATE_KEY segue declarado como opcional p/
  # compat com o caller, mas não é mais usado aqui.)

  # -----------------------------
  # 8️⃣ Supply-chain attestations
  # -----------------------------
  # Tres steps independentes: cosign sign, SBOM attest, SLSA provenance.
  # Cada um detecta visibilidade do repo e adapta --tlog-upload:
  # - publico: assinatura/attestations vao pro Rekor publico (auditavel).
  # - privado: --tlog-upload=false, vivem so no GHCR junto a imagem.
  supply-chain:
    name: Supply chain attestations
    runs-on: ubuntu-latest
    needs: [docker-push, prepare-image]
    permissions:
      contents: read
      packages: write
      id-token: write    # OIDC para Fulcio (cosign keyless)
    steps:
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: TourinhoM/org-ci-platform/.github/actions/cosign-sign@main
        with:
          image-ref: ghcr.io/${{ needs.prepare-image.outputs.image_repo }}
          image-digest: ${{ needs.docker-push.outputs.digest }}

      - uses: TourinhoM/org-ci-platform/.github/actions/sbom-attest@main
        with:
          image-ref: ghcr.io/${{ needs.prepare-image.outputs.image_repo }}
          image-digest: ${{ needs.docker-push.outputs.digest }}

      - uses: TourinhoM/org-ci-platform/.github/actions/slsa-attest@main
        with:
          image-ref: ghcr.io/${{ needs.prepare-image.outputs.image_repo }}
          image-digest: ${{ needs.docker-push.outputs.digest }}
