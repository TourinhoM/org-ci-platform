name: Helm Charts - Semantic Release (bump automático por chart)

on:
  workflow_call:
    inputs:
      charts-dir:
        required: false
        default: charts
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: false
        description: 'Private key (.pem) do GitHub App pra push de tag/commit.'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        if: vars.RELEASE_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release common
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          working_directory: ${{ inputs.charts-dir }}/common
          extra_plugins: |
            semantic-release-monorepo
            @semantic-release/exec
            @semantic-release/git

      - name: Release backend
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          working_directory: ${{ inputs.charts-dir }}/backend
          extra_plugins: |
            semantic-release-monorepo
            @semantic-release/exec
            @semantic-release/git

      - name: Release batch
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          working_directory: ${{ inputs.charts-dir }}/batch
          extra_plugins: |
            semantic-release-monorepo
            @semantic-release/exec
            @semantic-release/git

      - name: Release frontend
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          working_directory: ${{ inputs.charts-dir }}/frontend
          extra_plugins: |
            semantic-release-monorepo
            @semantic-release/exec
            @semantic-release/git
