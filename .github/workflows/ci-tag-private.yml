name: CI - Tag Release

on:
  workflow_call:
    inputs:
      dockerfile-path:
        required: false
        default: './Dockerfile'
        type: string
      docker-images:
        required: false
        default: ''
        type: string
        description: >
          Lista JSON das imagens do repo (mesmo formato do ci-push-private):
          [{"name": "api", "context": ".", "dockerfile": "docker/Dockerfile.api"}].
          Vazio = uma imagem so, com contexto na raiz e dockerfile-path.
      runner:
        required: false
        default: 'ubuntu-latest'
        type: string
        description: >
          Onde rodar os jobs (o Plan roda sempre no GitHub). Um label de
          runner (default ubuntu-latest) ou "auto": usa um runner self-hosted
          com o label dev-local (ver solutions-bytesoul/ci-runner) se houver um
          online e livre, senao ubuntu-latest. O auto precisa do secret
          RUNNER_READ_TOKEN (fine-grained, Self-hosted runners: Read-only na
          org); sem ele, cai no ubuntu-latest.
      security-bypass:
        required: false
        default: false
        type: boolean
        description: 'Roda os scans de segurança em modo não-bloqueante (findings reportados mas não travam a pipe)'
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: false
        description: >
          Private key (.pem) do GitHub App RELEASE_APP, usada na promoção
          cross-repo da tag no gitops-<app> (job update-gitops). Secret
          acessado sob `secrets: inherit` precisa ser DECLARADO aqui pra
          popular — senão chega vazio (footgun do reusable workflow).
      RUNNER_READ_TOKEN:
        required: false
        description: 'Token que le os runners da org, para o runner: auto.'

# Tag pipeline produz artefato versionado — nao cancelar em meio ao push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # -----------------------------
  # 0️⃣ Plano das imagens (ver ci-push-private.yml)
  # -----------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
      runs-on: ${{ steps.runner.outputs.runs-on }}
    steps:
      # runs-on de todos os outros jobs. Fica neste job, que ja roda em todo
      # evento, para o modo auto nao custar um job a mais.
      - id: runner
        env:
          MODO: ${{ inputs.runner }}
          GH_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$MODO" != "auto" ]; then
            echo "runs-on=$(jq -nc --arg r "$MODO" '$r')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          livres=0
          if [ -n "$GH_TOKEN" ]; then
            filtro='[.runners[] | select(.status == "online" and (.busy | not)'
            filtro+=' and any(.labels[]; .name == "dev-local"))] | length'
            contagens=$(gh api --paginate "orgs/$ORG/actions/runners" --jq "$filtro") || contagens=0
            livres=$(awk '{s += $1} END {print s + 0}' <<< "$contagens")
          else
            echo "::warning::runner: auto sem o secret RUNNER_READ_TOKEN; usando ubuntu-latest."
          fi
          if [ "$livres" -gt 0 ]; then
            echo "runs-on=[\"self-hosted\",\"dev-local\"]" >> "$GITHUB_OUTPUT"
            echo "Runner: self-hosted dev-local ($livres livre(s))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "runs-on=\"ubuntu-latest\"" >> "$GITHUB_OUTPUT"
            echo "Runner: ubuntu-latest (nenhum dev-local livre)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: images
        env:
          DOCKER_IMAGES: ${{ inputs.docker-images }}
          DOCKERFILE: ${{ inputs.dockerfile-path }}
        run: |
          set -euo pipefail
          if [ -n "$DOCKER_IMAGES" ]; then
            images=$(jq -c '[.[] | {name: (.name // ""), context: (.context // "."), dockerfile}]' <<< "$DOCKER_IMAGES")
          else
            images=$(jq -nc --arg f "$DOCKERFILE" '[{name: "", context: ".", dockerfile: $f}]')
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # -----------------------------
  # 1️⃣ Trivy FS
  # -----------------------------
  trivy-fs:
    name: Trivy FS Scan
    runs-on: ${{ fromJSON(needs.plan.outputs.runs-on) }}
    needs: plan
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ⚠️ Security scans running in non-blocking mode
        if: ${{ inputs.security-bypass }}
        run: echo "::warning::security-bypass=true — scans will run but findings will NOT block the pipeline."
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-fs@main
        continue-on-error: ${{ inputs.security-bypass == true }}

  # -----------------------------
  # 2️⃣ Trivy Config (Dockerfile lint)
  # -----------------------------
  trivy-config:
    name: ${{ matrix.name && format('Trivy Config Scan ({0})', matrix.name) || 'Trivy Config Scan' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs-on) }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ⚠️ Security scans running in non-blocking mode
        if: ${{ inputs.security-bypass }}
        run: echo "::warning::security-bypass=true — scans will run but findings will NOT block the pipeline."
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-config@main
        continue-on-error: ${{ inputs.security-bypass == true }}
        with:
          config-path: ${{ matrix.dockerfile }}

  # -----------------------------
  # 3️⃣ Prepare Image
  # -----------------------------
  prepare-image:
    name: Prepare image
    runs-on: ${{ fromJSON(needs.plan.outputs.runs-on) }}
    needs: [plan, trivy-fs, trivy-config]
    if: ${{ always() && (inputs.security-bypass || (needs.trivy-fs.result == 'success' && needs.trivy-config.result == 'success')) }}
    outputs:
      image_repo: ${{ steps.prepare.outputs.repo }}
      image_tag: ${{ steps.prepare.outputs.tag }}
      push_tags: ${{ steps.prepare.outputs.push_tags }}
    steps:
      - id: prepare
        uses: TourinhoM/org-ci-platform/.github/actions/prepare-image-tag@main

  # -----------------------------
  # 4️⃣ Docker Build
  # -----------------------------
  docker-build:
    name: ${{ matrix.name && format('Docker Build ({0})', matrix.name) || 'Docker Build' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs-on) }}
    needs: [plan, prepare-image]
    if: ${{ always() && needs.plan.result == 'success' && (inputs.security-bypass || needs.prepare-image.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # ghcr.io/<repo>:<tag> com uma imagem só; ghcr.io/<repo>/<name>:<tag> com docker-images.
      - name: Image ref
        env:
          REPO: ${{ needs.prepare-image.outputs.image_repo }}
          TAG: ${{ needs.prepare-image.outputs.image_tag }}
          NAME: ${{ matrix.name }}
        run: echo "IMAGE_REF=ghcr.io/${REPO}${NAME:+/$NAME}:${TAG}" >> "$GITHUB_ENV"
      - uses: TourinhoM/org-ci-platform/.github/actions/docker-build-artifact@main
        with:
          image-ref: ${{ env.IMAGE_REF }}
          context: ${{ matrix.context }}
          dockerfile-path: ${{ matrix.dockerfile }}
          cache-scope: ${{ matrix.name || 'buildkit' }}
          upload-artifact: 'false'
      - name: ⚠️ Security scans running in non-blocking mode
        if: ${{ inputs.security-bypass }}
        run: echo "::warning::security-bypass=true — scans will run but findings will NOT block the pipeline."
      - uses: TourinhoM/org-ci-platform/.github/actions/trivy-image@main
        continue-on-error: ${{ inputs.security-bypass == true }}
        with:
          image-ref: ${{ env.IMAGE_REF }}

