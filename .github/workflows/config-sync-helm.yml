name: Config Sync (Helm)

# Sincroniza o contrato do dev (tools/microsservico/values*, repo de código) ->
# values do repo de gitops (gitops-<app>), que o dev não acessa. Cópia pura
# (values-layering: sem re-key). Escrita cross-repo via token do RELEASE_APP —
# separação de responsabilidades (dev mexe no contrato; máquina materializa).
# A image NÃO passa por aqui: é do Kargo (values/<env>.image.yaml).
#
# A materialização é via PULL REQUEST no gitops (não push direto): a plataforma
# revisa antes do deploy. O gate de aprovação é enforced por branch protection +
# CODEOWNERS no gitops-<app> (não pela action) — o token do App é escopado a um
# repo e não pede review de team. Re-push do dev antes do merge ATUALIZA o mesmo
# PR (branch fixo), então N edições viram 1 diff pra revisar.
on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
        description: >
          Private key (.pem) do RELEASE_APP. Declarado aqui pois cross-org não
          herda por inherit. O App precisa de Contents: write E Pull requests:
          write no gitops-<app> (o modelo PR exige o segundo além do primeiro).

concurrency:
  group: config-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  config-sync:
    runs-on: ubuntu-latest
    if: vars.RELEASE_APP_ID != ''
    permissions:
      contents: read   # a escrita é no OUTRO repo (gitops), via token do App
    steps:
      - name: Checkout código (tools/microsservico)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: code
          fetch-depth: 1
          sparse-checkout: tools/microsservico

      - name: Token do RELEASE_APP (escopado ao gitops-<app>)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gitops-${{ github.event.repository.name }}

      - name: Checkout gitops-<app>
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository_owner }}/gitops-${{ github.event.repository.name }}
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          path: gitops
          fetch-depth: 1

      # Cópia pura (values-layering, sem re-key): o dev já escreve na forma do
      # gitops. image.yaml (Kargo) e Chart.yaml (Renovate) não existem em tools/,
      # então nunca são copiados/tocados.
      - name: Materializa o contrato no gitops
        run: |
          set -euo pipefail
          cp code/tools/microsservico/values.yaml gitops/values.yaml
          mkdir -p gitops/values
          if compgen -G "code/tools/microsservico/values/*.yaml" > /dev/null; then
            cp code/tools/microsservico/values/*.yaml gitops/values/
          fi

      - name: Abre/atualiza PR no gitops-<app>
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          path: gitops
          token: ${{ steps.app-token.outputs.token }}
          branch: config-sync/${{ github.event.repository.name }}
          delete-branch: true
          # Escopa o commit aos values do dev. image.yaml/Chart.yaml não mudam
          # (não foram copiados), então nem entram no diff.
          add-paths: |
            values.yaml
            values/*.yaml
          commit-message: "chore(config): sync values do tools/microsservico"
          title: "chore(config): sync de ${{ github.repository }}"
          body: |
            Sincroniza `tools/microsservico/values*` de `${{ github.repository }}`
            (commit ${{ github.sha }}) para os values do gitops.

            Cópia pura (values-layering). Não toca `values/<env>.image.yaml` (Kargo)
            nem `Chart.yaml` (Renovate). **Merge = deploy** — revisar antes de aprovar.
          labels: config-sync
