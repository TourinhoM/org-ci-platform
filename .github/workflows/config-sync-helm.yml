name: Config Sync (Helm)

# Sincroniza o contrato do dev (tools/microsservico/values*, repo de código) ->
# values do repo de gitops (gitops-<app>), que o dev não acessa. Cópia pura
# (values-layering: sem re-key). Escrita cross-repo via token do RELEASE_APP —
# separação de responsabilidades (dev mexe no contrato; máquina materializa).
# A image NÃO passa por aqui: é do Kargo (values/<env>.image.yaml).
#
# Push DIRETO no main do gitops — mesmo modelo do Kargo (o gate é a fonte, não o
# merge): gitops/main é machine-owned pelos dois fluxos (config aqui, image no
# Kargo), sem branch protection nem PR. Se um dia quiser gate humano, ele vai no
# repo de CÓDIGO (CODEOWNERS em tools/microsservico/**), não aqui.
on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
        description: >
          Private key (.pem) do RELEASE_APP (Contents: write no gitops-<app>).
          Declarado aqui pois cross-org não herda por inherit.

concurrency:
  group: config-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  config-sync:
    runs-on: ubuntu-latest
    if: vars.RELEASE_APP_ID != ''
    permissions:
      contents: read   # a escrita é no OUTRO repo (gitops), via token do App
    steps:
      - name: Checkout código (tools/microsservico)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: code
          fetch-depth: 1
          sparse-checkout: tools/microsservico

      - name: Token do RELEASE_APP (escopado ao gitops-<app>)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gitops-${{ github.event.repository.name }}

      - name: Checkout gitops-<app>
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository_owner }}/gitops-${{ github.event.repository.name }}
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          path: gitops
          persist-credentials: true
          fetch-depth: 1

      # Cópia pura (values-layering, sem re-key): o dev já escreve na forma do
      # gitops. image.yaml (Kargo) e Chart.yaml (Renovate) não existem em tools/,
      # então nunca são copiados/tocados.
      - name: Sincroniza values e push no gitops
        working-directory: gitops
        run: |
          set -euo pipefail
          cp ../code/tools/microsservico/values.yaml values.yaml
          mkdir -p values
          if compgen -G "../code/tools/microsservico/values/*.yaml" > /dev/null; then
            cp ../code/tools/microsservico/values/*.yaml values/
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Só os values do dev entram no add; image.yaml (Kargo)/Chart.yaml ficam de fora.
          git add values.yaml values/*.yaml
          git reset -q -- 'values/*.image.yaml' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração — gitops já em sincronia com o contrato."
            exit 0
          fi
          git commit -m "chore(config): sync values do tools/microsservico [skip ci]"
          git push origin HEAD:main
